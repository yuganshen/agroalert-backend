spring.application.name=agroalert-backend

# Servidor
server.port=8080

# Conexión a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agroalert_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Configuración de CORS
agroalert.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Configuración de codificación y zona horaria
#spring.jackson.time-zone=America/Lima

# Configuración SMTP (Ejemplo con Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de Spring Boot Admin Client
spring.boot.admin.client.url=http://localhost:8080
spring.boot.admin.client.instance.name=AgroAlert-Backend
spring.boot.admin.client.instance.prefer-ip=true

# Configuración de Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,scheduledtasks,env,loggers,threaddump
management.endpoint.health.show-details=always
management.health.mail.enabled=true
